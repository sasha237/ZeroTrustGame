services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: balance_of_terror
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bot -d balance_of_terror']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://bot:bot@db:5432/balance_of_terror
      REPO: pg
      # Vite dev server origin (and any deployed client origin), comma-separated.
      CORS_ORIGIN: http://localhost:5173,http://localhost:4173
      TOKEN_TTL_HOURS: 720
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/healthz || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
